# Шаблон: ${DOMAIN} подставляется при старте контейнера из переменной окружения DOMAIN

server {
    listen 80;
    server_name ${DOMAIN};

    # Все HTTP-запросы постоянно перенаправляем на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${DOMAIN};

    # Сертификат, полученный Certbot от Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Проверка домена при продлении: Let's Encrypt проходит по редиректу с HTTP
    # на HTTPS и забирает файл отсюда
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
